<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-title>
      <ion-icon name="analytics" class="ion-padding-end"></ion-icon>
      Signalements & Statistiques
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Statistiques générales -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="bar-chart-outline"></ion-icon>
        Statistiques générales
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div class="chart-placeholder">
        <ion-icon name="stats-chart" size="large" color="medium"></ion-icon>
        <p>Graphique des signalements (à intégrer)</p>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Liste des signalements -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Signalements récents</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let signalement of signalements">

          <!-- Affiche image si elle existe -->
          <ion-thumbnail slot="start" *ngIf="signalement.photoURL">
            <ion-img [src]="signalement.photoURL"></ion-img>
          </ion-thumbnail>

          <!-- Sinon icône de signalement -->
          <ion-icon *ngIf="!signalement.photoURL" name="warning" slot="start" color="danger"></ion-icon>

          <ion-label>
            <h3>{{ signalement.typeNuisance }}</h3>
            <p>{{ signalement.localisation }}</p>
          </ion-label>

          <ion-chip slot="end" color="medium">
            <ion-icon name="calendar"></ion-icon>
            <ion-label> {{ signalement.date | date:'shortDate' }}
 </ion-label>
          </ion-chip>

        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" fill="outline" color="success">
    <ion-icon name="eye" slot="start"></ion-icon>
    Voir tous les signalements
  </ion-button>

</ion-content>
