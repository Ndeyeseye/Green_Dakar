// accueil.page.html
<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-title>
      <div class="header-title">
        <ion-icon name="earth" class="logo-icon"></ion-icon>
        Clean Earth - Accueil
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon name="notifications-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="accueil-content">
  
  <!-- Hero Section -->
  <div class="hero-section">
    <ion-card class="welcome-card">
      <ion-card-content>
        <h2>Bienvenue dans votre espace ONG</h2>
        <p>Gérez vos actions environnementales et suivez l'impact de votre organisation</p>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Statistics Grid -->
  <div class="stats-section">
    <ion-grid>
      <ion-row>
        <ion-col size="6" size-md="3" *ngFor="let stat of stats">
          <ion-card class="stat-card" button (click)="onStatClick(stat)">
            <ion-card-content>
              <div class="stat-number" [style.color]="'var(--ion-color-' + stat.color + ')'">
                {{ stat.number }}
              </div>
              <div class="stat-label">{{ stat.label }}</div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
