<ion-header>
  <ion-toolbar color="success">
    <ion-title>Modifier l'événement</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="floating">Titre</ion-label>
      <ion-input [(ngModel)]="event.title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Date</ion-label>
      <ion-input type="text" [(ngModel)]="event.date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Lieu</ion-label>
      <ion-input [(ngModel)]="event.location"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="success" (click)="save()">Enregistrer</ion-button>
</ion-content>
