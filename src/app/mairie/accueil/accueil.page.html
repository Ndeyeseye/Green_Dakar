<ion-header [translucent]="true">
  <ion-toolbar color="green-dakar">
    <ion-title>Mairie</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content" [fullscreen]="true">

  <div class="dashboard-title">
    <h2>Tableau de bord</h2>
  </div>
  

  <div class="dashboard-grid">
    <ion-card class="dashboard-card">
      <ion-card-content>
        <ion-icon name="warning-outline" class="card-icon"></ion-icon>
        <div class="card-value">24</div>
        <div class="card-label">Alertes</div>
      </ion-card-content>
    </ion-card>

    <ion-card class="dashboard-card">
      <ion-card-content>
        <ion-icon name="location-outline" class="card-icon"></ion-icon>
        <div class="card-value">8</div>
        <div class="card-label" color="green">Zones à nettoyer</div>
      </ion-card-content>
    </ion-card>

    <ion-card class="dashboard-card">
      <ion-card-content>
        <ion-icon name="checkmark-done-outline" class="card-icon"></ion-icon>
        <div class="card-value">12</div>
        <div class="card-label">Interventions</div>
      </ion-card-content>
    </ion-card>

    <ion-card class="dashboard-card">
      <ion-card-content>
        <ion-icon name="document-text-outline" class="card-icon"></ion-icon>
        <div class="card-value">5</div>
        <div class="card-label">Rapports</div>
      </ion-card-content>
    </ion-card>
  </div>

</ion-content>
