<ion-header>
  <ion-toolbar style="--background: #1e5631;">
    <ion-buttons slot="start">
      <ion-back-button [text]="'Précé..'" defaultHref="/citoyen/tabs/profil" class="custom-back-button"></ion-back-button>
    </ion-buttons>
    <ion-title color="white">Changer le mot de passe</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">
    <div class="title">Sécurisez votre compte</div>

    <ion-item>
      <ion-label position="floating">Mot de passe actuel</ion-label>
      <ion-input type="password" [(ngModel)]="currentPassword" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Nouveau mot de passe</ion-label>
      <ion-input type="password" [(ngModel)]="newPassword" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Confirmer le nouveau mot de passe</ion-label>
      <ion-input type="password" [(ngModel)]="confirmPassword" required></ion-input>
    </ion-item>

    <ion-button expand="block" (click)="changePassword()">
      Enregistrer les modifications
    </ion-button>
  </div>
</ion-content>
