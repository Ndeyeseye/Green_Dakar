<ion-header>
  <ion-toolbar style="--background: #1e5631;" class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button [text]="'Précédent'" defaultHref="/citoyen/tabs/profil" class="custom-back-button"></ion-back-button>
    </ion-buttons>
    <ion-title>Modifier le profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Nom complet</ion-label>
    <ion-input [(ngModel)]="newName"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Adresse email</ion-label>
    <ion-input [(ngModel)]="currentEmail" type="email"></ion-input>
  </ion-item>

  <ion-button expand="block" color="success" class="ion-margin-top" (click)="save()">
    Enregistrer les modifications
  </ion-button>
</ion-content>
