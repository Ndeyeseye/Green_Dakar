<ion-tabs>
  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="accueil" (click)="activeTab = 'accueil'">
      <ion-icon *ngIf="activeTab === 'accueil'" name="home"></ion-icon>
      <ion-icon *ngIf="activeTab !== 'accueil'" name="home-outline"></ion-icon>
      <ion-label>Accueil</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="carte" (click)="activeTab = 'carte'">
      <ion-icon *ngIf="activeTab === 'carte'" name="map"></ion-icon>
      <ion-icon *ngIf="activeTab !== 'carte'" name="map-outline"></ion-icon>
      <ion-label>Carte</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="signalement" (click)="activeTab = 'signalement'">
      <ion-icon *ngIf="activeTab === 'signalement'" name="add-circle"></ion-icon>
      <ion-icon *ngIf="activeTab !== 'signalement'" name="add-circle-outline"></ion-icon>
      <ion-label>signaler</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="evenements" (click)="activeTab = 'evenements'">
      <ion-icon *ngIf="activeTab === 'evenements'" name="calendar"></ion-icon>
      <ion-icon *ngIf="activeTab !== 'evenements'" name="calendar-outline"></ion-icon>
      <ion-label>Evenem.</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profil" (click)="activeTab = 'profil'">
      <ion-icon *ngIf="activeTab === 'profil'" name="person"></ion-icon>
      <ion-icon *ngIf="activeTab !== 'profil'" name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
